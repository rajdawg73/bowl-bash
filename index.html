                      <button onClick={() => setGameResult(num, dog)} disabled={!user} style={{
                        flex: 1, padding: '10px', borderRadius: '6px', border: 'none', cursor: user ? 'pointer' : 'default',
                        background: results[num] === dog ? '#4ecdc4' : 'rgba(255,255,255,0.08)', color: results[num] === dog ? '#000' : '#fff', position:'relative', overflow:'hidden'
                      }}>
                         <div style={{position:'relative', zIndex:2, fontWeight:'bold'}}>{dogName}</div>
                         {!isDecided && <div style={{position:'absolute', bottom:0, left:0, height:'3px', background:'rgba(255,107,107,0.5)', width: `${(1-winProb)*100}%`}}></div>}
                      </button>
                    </div>
                  </div>
                );
              })}
             </div>
          )}

          {/* PROJECTIONS VIEW */}
          {view === 'projections' && (
            <div>
              <div style={{background:'rgba(147,197,253,0.1)', padding:'15px', borderRadius:'10px', textAlign:'center', marginBottom:'20px'}}>
                <h3 style={{margin:'0 0 10px 0', color:'#93c5fd'}}>Monte Carlo Simulation</h3>
                <p style={{fontSize:'0.8rem', color:'#aaa', marginBottom:'15px'}}>Simulates the remaining tournament 1,000 times using spread probabilities.</p>
                <button onClick={runProjections} disabled={isSimulating} style={{
                  background: isSimulating ? '#555' : '#93c5fd', color:'#000', border:'none', padding:'10px 20px', borderRadius:'20px', fontWeight:'bold', cursor:'pointer'
                }}>
                  {isSimulating ? 'Running...' : 'Run 1,000 Simulations'}
                </button>
              </div>

              {simulations && (
                <div style={{display:'grid', gap:'15px'}}>
                  {MY_ENTRIES.map(name => {
                    const stat = simulations[name];
                    return (
                      <div key={name} style={{background:'rgba(255,255,255,0.05)', padding:'15px', borderRadius:'10px'}}>
                        <div style={{fontWeight:'bold', marginBottom:'10px', color:'#fff'}}>{name}</div>
                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'15px'}}>
                           <div>
                              <div style={{fontSize:'0.7rem', color:'#aaa'}}>Cash Probability (Top 60)</div>
                              <div style={{fontSize:'1.2rem', fontWeight:'bold', color: stat.top60Pct > 50 ? '#4ecdc4' : '#fff'}}>{stat.top60Pct}%</div>
                              <div className="sim-bar-bg"><div className="sim-bar-fill" style={{width:`${stat.top60Pct}%`, background:'#4ecdc4'}}></div></div>
                           </div>
                           <div>
                              <div style={{fontSize:'0.7rem', color:'#aaa'}}>Jackpot Probability (Top 10)</div>
                              <div style={{fontSize:'1.2rem', fontWeight:'bold', color: stat.top10Pct > 10 ? '#ffd93d' : '#fff'}}>{stat.top10Pct}%</div>
                              <div className="sim-bar-bg"><div className="sim-bar-fill" style={{width:`${stat.top10Pct}%`, background:'#ffd93d'}}></div></div>
                           </div>
                        </div>
                        <div style={{fontSize:'0.75rem', color:'#888', marginTop:'10px'}}>Proj. Avg Rank: #{stat.avgRank}</div>
                      </div>
                    )
                  })}
                </div>
              )}
            </div>
          )}

          {/* STANDINGS VIEW */}
          {view === 'standings' && (
            <div>
              <input type="text" placeholder="Search entries..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                style={{ width: '100%', padding: '12px', borderRadius: '8px', border: 'none', background: 'rgba(255,255,255,0.1)', color: '#fff', marginBottom: '15px' }} />
              <div style={{height:'60vh', overflowY:'auto'}}>
                 {filteredStandings.slice(0, 100).map((entry, idx) => {
                    const isMine = MY_ENTRIES.includes(entry.name);
                    const rank = standings.findIndex(e => e.name === entry.name) + 1;
                    return (
                      <div key={idx} style={{display:'flex', padding:'10px', borderBottom:'1px solid rgba(255,255,255,0.05)', background: isMine ? 'rgba(255,255,255,0.1)' : 'transparent'}}>
                         <div style={{width:'40px', color: rank <= 60 ? '#4ecdc4' : '#666', fontWeight:'bold'}}>#{rank}</div>
                         <div style={{flex:1, fontWeight: isMine ? 'bold' : 'normal', color: isMine ? '#fff' : '#aaa'}}>{entry.name}</div>
                         <div style={{fontWeight:'bold'}}>{entry.wins}-{entry.losses}</div>
                      </div>
                    )
                 })}
              </div>
            </div>
          )}
          
          {/* PAYOUTS VIEW */}
          {view === 'payouts' && (
             <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(120px, 1fr))', gap: '10px' }}>
              {[{ place: '1st', pct: 15 }, { place: '2nd', pct: 10 }, { place: '3rd', pct: 6 }, { place: '4th', pct: 5 },
                { place: '5th', pct: 3 }, { place: '6th', pct: 3 }, { place: '7-9th', pct: 2 }, { place: '10-60th', pct: 1 }, { place: 'Last', pct: 1 }
              ].map(p => (
                <div key={p.place} style={{ background: p.place === '1st' ? 'rgba(255,215,0,0.15)' : 'rgba(255,255,255,0.05)', padding: '15px', borderRadius: '10px', textAlign: 'center' }}>
                  <div style={{ color: p.place === '1st' ? '#ffd93d' : '#888', marginBottom: '5px', fontWeight: 'bold' }}>{p.place}</div>
                  <div style={{ fontSize: '1.2rem', fontWeight: 'bold', color: '#4ecdc4' }}>${Math.round(pot * p.pct / 100).toLocaleString()}</div>
                  <div style={{ fontSize: '0.7rem', color: '#666' }}>{p.pct}%</div>
                </div>
              ))}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BowlBashTracker />);
  </script>
</body>
</html>
