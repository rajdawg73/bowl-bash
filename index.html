              <div style={{ fontSize: '1.1rem', fontWeight: 'bold', color: '#ffd700' }}>${pot.toLocaleString()}</div>
            </div>
            <div style={{ background: 'rgba(78,205,196,0.1)', padding: '12px', borderRadius: '10px', textAlign: 'center' }}>
              <div style={{ color: '#E41C38', fontSize: '0.7rem' }}>1ST</div>
              <div style={{ fontSize: '1.1rem', fontWeight: 'bold', color: '#E41C38' }}>${Math.round(pot * 0.15).toLocaleString()}</div>
            </div>
            <div style={{ background: 'rgba(228,28,56,0.1)', padding: '12px', borderRadius: '10px', textAlign: 'center' }}>
              <div style={{ color: '#E41C38', fontSize: '0.7rem' }}>GAMES</div>
              <div style={{ fontSize: '1.1rem', fontWeight: 'bold', color: '#E41C38' }}>{Object.keys(results).length}/27</div>
            </div>
            <div style={{ background: 'rgba(147,197,253,0.1)', padding: '12px', borderRadius: '10px', textAlign: 'center' }}>
              <div style={{ color: '#93c5fd', fontSize: '0.7rem' }}>TB</div>
              <input type="number" value={tiebreakerScore} onChange={(e) => { if (isUnlocked) saveTiebreaker(e.target.value); else setShowPinModal(true); }}
                placeholder="—" style={{ width: '100%', background: 'transparent', border: 'none', color: '#93c5fd', fontSize: '1.1rem', fontWeight: 'bold', textAlign: 'center' }} />
            </div>
          </div>

          {/* Today's Games */}
          {view === 'dashboard' && (
            <>
              <div style={{ background: 'rgba(78,205,196,0.1)', padding: '15px', borderRadius: '12px', marginBottom: '20px', border: '1px solid rgba(78,205,196,0.3)' }}>
                <h3 style={{ color: '#E41C38', margin: '0 0 12px', fontSize: '0.9rem' }}>
                  📅 {todaysInfo.isToday ? "TODAY" : todaysInfo.displayDate} — OUR PICKS
                </h3>
                {todaysInfo.todaysGames.length === 0 ? (
                  <p style={{ color: '#9CA3AF' }}>No upcoming games</p>
                ) : (
                  <div style={{ overflowX: 'auto' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.8rem' }}>
                      <thead>
                        <tr style={{ borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
                          <th style={{ padding: '8px', textAlign: 'left', color: '#9CA3AF' }}>Game</th>
                          {['Wolf', 'Tripod', 'Mini', 'Perez'].map(n => (
                            <th key={n} style={{ padding: '8px', textAlign: 'center', color: '#E41C38', fontSize: '0.65rem' }}>{n}</th>
                          ))}
                          <th style={{ padding: '8px', textAlign: 'center', color: '#9CA3AF' }}>Result</th>
                        </tr>
                      </thead>
                      <tbody>
                        {todaysInfo.todaysGames.map(([num, fav, spread, dog, bowl, date, favName, dogName]) => {
                          const dist = DISTRIBUTIONS[num - 1];
                          const result = results[num];
                          return (
                            <tr key={num} style={{ borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                              <td style={{ padding: '10px 8px' }}>
                                <div style={{ fontWeight: 'bold', fontSize: '0.85rem' }}>{favName} vs {dogName}</div>
                                <div style={{ fontSize: '0.65rem', color: '#666' }}>{spread}</div>
                              </td>
                              {myEntriesData.map(entry => {
                                const pick = entry.picks[num - 1];
                                const pickName = getPickName(pick, num);
                                const isFav = pick === fav;
                                const won = result && pick === result;
                                const lost = result && pick !== result;
                                return (
                                  <td key={entry.name} style={{ padding: '8px', textAlign: 'center', fontWeight: 'bold', fontSize: '0.75rem',
                                    color: won ? '#6ee7b7' : lost ? '#f87171' : isFav ? '#E41C38' : '#fb923c' }}>
                                    {pickName.split(' ')[0]}
                                  </td>
                                );
                              })}
                              <td style={{ padding: '8px', textAlign: 'center' }}>
                                {result ? <span style={{ color: '#6ee7b7', fontWeight: 'bold' }}>{getPickName(result, num).split(' ')[0]}</span> : <span style={{ color: '#666' }}>—</span>}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              {/* My Entries */}
              <div style={{ background: 'rgba(228,28,56,0.1)', padding: '15px', borderRadius: '12px', marginBottom: '20px', border: '1px solid rgba(228,28,56,0.3)' }}>
                <h3 style={{ color: '#E41C38', margin: '0 0 12px', fontSize: '0.9rem' }}>MY ENTRIES</h3>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '12px' }}>
                  {myStandings.map(entry => {
                    const data = MY_ENTRIES_DATA[entry.name] || {};
                    return (
                      <div key={entry.name} style={{ background: 'rgba(0,0,0,0.5)', padding: '14px', borderRadius: '10px', border: '1px solid rgba(228,28,56,0.2)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px' }}>
                          <div style={{ fontSize: '0.8rem', color: '#F5F5DC', fontWeight: 'bold' }}>{entry.name.replace("BIG TUNA'S ", "").replace("THE ", "")}</div>
                          <span style={{ fontSize: '1.4rem', fontWeight: 'bold', color: entry.rank <= 9 ? '#ffd93d' : entry.rank <= 100 ? '#E41C38' : '#9CA3AF' }}>#{entry.rank}</span>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                          <span style={{ fontSize: '0.85rem' }}>
                            <span style={{ color: '#6ee7b7' }}>{entry.wins}W</span>
                            <span style={{ color: '#4a4a4a' }}> / </span>
                            <span style={{ color: '#f87171' }}>{entry.losses}L</span>
                          </span>
                          {data.swingGames > 0 && (
                            <span style={{ fontSize: '0.7rem', background: 'rgba(228,28,56,0.3)', padding: '2px 8px', borderRadius: '4px', color: '#F5F5DC' }}>
                              {data.swingGames} swing {data.swingGames === 1 ? 'game' : 'games'}
                            </span>
                          )}
                        </div>
                        {monteCarloResults && monteCarloResults[entry.name] ? (
                          <div style={{ background: "rgba(0,0,0,0.3)", padding: "8px", borderRadius: "6px", marginTop: "6px", fontSize: "0.7rem" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "4px" }}>
                              <span style={{ color: "#9CA3AF" }}>Projected Finish:</span>
                              <span style={{ color: "#ffd93d", fontWeight: "bold" }}>#{monteCarloResults[entry.name].median}</span>
                            </div>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "4px" }}>
                              <span style={{ color: "#9CA3AF" }}>80% Range:</span>
                              <span><span style={{ color: "#6ee7b7" }}>#{monteCarloResults[entry.name].p10}</span> - <span style={{ color: "#f87171" }}>#{monteCarloResults[entry.name].p90}</span></span>
                            </div>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "4px" }}>
                              <span style={{ color: "#9CA3AF" }}>Top 10:</span>
                              <span style={{ color: monteCarloResults[entry.name].top10Pct > 10 ? "#6ee7b7" : "#F5F5DC" }}>{monteCarloResults[entry.name].top10Pct}%</span>
                            </div>
                            <div style={{ display: "flex", justifyContent: "space-between" }}>
                              <span style={{ color: "#9CA3AF" }}>Win Pool:</span>
                              <span style={{ color: monteCarloResults[entry.name].winPct > 1 ? "#ffd93d" : "#F5F5DC" }}>{monteCarloResults[entry.name].winPct}%</span>
                            </div>
                          </div>
                        ) : (
                          <div style={{ background: "rgba(0,0,0,0.3)", padding: "6px 8px", borderRadius: "6px", marginTop: "6px", fontSize: "0.7rem", color: "#9CA3AF" }}>
                            All games complete
                          </div>
                        )}
                        {data.keyGames && (
                          <div style={{ fontSize: '0.65rem', color: '#9CA3AF', borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '6px', marginTop: '4px' }}>
                            {data.keyGames}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
                {leverageGames.length > 0 && (
                  <div style={{ marginTop: '12px', padding: '10px', background: 'rgba(0,0,0,0.3)', borderRadius: '8px' }}>
                    <div style={{ fontSize: '0.75rem', color: '#E41C38', marginBottom: '8px', fontWeight: 'bold' }}>HIGH LEVERAGE GAMES</div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                      {leverageGames.slice(0, 3).map(lg => (
                        <div key={lg.gameNum} style={{ background: 'rgba(228,28,56,0.2)', padding: '6px 10px', borderRadius: '6px', fontSize: '0.7rem' }}>
                          <div style={{ color: '#F5F5DC', fontWeight: 'bold' }}>{lg.game[4].split(' ')[0]}</div>
                          <div style={{ color: '#9CA3AF', fontSize: '0.6rem' }}>
                            {lg.affectedEntries.map(e => e.name.replace("BIG TUNA'S ", "").replace("THE ", "").split(' ')[0]).join(', ')} on {lg.affectedEntries[0]?.isFav ? 'fav' : 'dog'}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </>
          )}

          {/* Navigation */}
          <div style={{ display: 'flex', gap: '8px', marginBottom: '20px', flexWrap: 'wrap' }}>
            {['dashboard', 'games', 'standings', 'payouts'].map(v => (
              <button key={v} onClick={() => setView(v)} style={{
                padding: '10px 16px', borderRadius: '8px', border: 'none',
                background: view === v ? '#E41C38' : 'rgba(255,255,255,0.1)',
                color: view === v ? '#000' : '#888', cursor: 'pointer', fontWeight: 'bold',
                textTransform: 'uppercase', fontSize: '0.8rem'
              }}>{v}</button>
            ))}
            <button onClick={() => isUnlocked ? setIsUnlocked(false) : setShowPinModal(true)} style={{
              padding: '10px 16px', borderRadius: '8px', border: `1px solid ${isUnlocked ? 'rgba(78,205,196,0.3)' : 'rgba(228,28,56,0.3)'}`,
              background: 'transparent', color: isUnlocked ? '#E41C38' : '#E41C38', cursor: 'pointer', fontWeight: 'bold', fontSize: '0.8rem', marginLeft: 'auto'
            }}>{isUnlocked ? '🔒 Lock' : '🔐 Unlock'}</button>
          </div>

          {/* Games View */}
          {view === 'games' && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '12px' }}>
              {GAMES.map(([num, fav, spread, dog, bowl, date, favName, dogName]) => {
                const dist = DISTRIBUTIONS[num - 1];
                return (
                  <div key={num} style={{ background: results[num] ? 'rgba(78,205,196,0.15)' : 'rgba(255,255,255,0.05)', padding: '15px', borderRadius: '10px', border: `1px solid ${results[num] ? 'rgba(78,205,196,0.4)' : 'rgba(255,255,255,0.1)'}` }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                      <span style={{ color: '#E41C38', fontSize: '0.75rem', fontWeight: 'bold' }}>{date}</span>
                      <span style={{ color: '#ffd93d', fontSize: '0.85rem', fontWeight: 'bold' }}>{spread}</span>
                    </div>
                    <div style={{ fontSize: '0.7rem', color: '#9CA3AF', marginBottom: '10px' }}>{bowl}</div>
                    <div style={{ display: 'flex', gap: '10px' }}>
                      <button onClick={() => setGameResult(num, fav)} style={{
                        flex: 1, padding: '12px 8px', borderRadius: '6px', border: 'none',
                        background: results[num] === fav ? '#E41C38' : 'rgba(255,255,255,0.1)',
                        color: results[num] === fav ? '#000' : '#fff', cursor: 'pointer', fontWeight: 'bold', fontSize: '0.8rem'
                      }}>
                        {favName}<div style={{ fontSize: '0.6rem', opacity: 0.7 }}>{dist.favPct}%</div>
                      </button>
                      <button onClick={() => setGameResult(num, dog)} style={{
                        flex: 1, padding: '12px 8px', borderRadius: '6px', border: 'none',
                        background: results[num] === dog ? '#E41C38' : 'rgba(255,255,255,0.1)',
                        color: results[num] === dog ? '#000' : '#fff', cursor: 'pointer', fontWeight: 'bold', fontSize: '0.8rem'
                      }}>
                        {dogName}<div style={{ fontSize: '0.6rem', opacity: 0.7 }}>{dist.dogPct}%</div>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Standings View - Grouped by Record */}
          {view === 'standings' && (
            <div>
              <div style={{ marginBottom: '15px', padding: '10px', background: 'rgba(228,28,56,0.1)', borderRadius: '8px', fontSize: '0.75rem', color: '#9CA3AF' }}>
                Click any record to expand and see entries. <span style={{ color: '#E41C38' }}>Your entries highlighted.</span>
              </div>
              <div style={{ maxHeight: '500px', overflowY: 'auto' }}>
                {groupedStandings.map(group => {
                  const key = `${group.wins}-${group.losses}`;
                  const isExpanded = expandedRecords[key];
                  const firstRank = group.entries[0]?.rank;
                  const lastRank = group.entries[group.entries.length - 1]?.rank;
                  return (
                    <div key={key} style={{ marginBottom: '4px' }}>
                      <div
                        onClick={() => setExpandedRecords(prev => ({ ...prev, [key]: !prev[key] }))}
                        style={{
                          display: 'flex', alignItems: 'center', padding: '12px 14px', borderRadius: '8px', cursor: 'pointer',
                          background: group.hasMyEntry ? 'rgba(228,28,56,0.25)' : firstRank <= 60 ? 'rgba(78,205,196,0.1)' : 'rgba(255,255,255,0.03)',
                          border: group.hasMyEntry ? '2px solid #E41C38' : '1px solid rgba(255,255,255,0.05)'
                        }}>
                        <span style={{ width: '70px', fontWeight: 'bold', color: firstRank <= 9 ? '#ffd93d' : firstRank <= 60 ? '#E41C38' : '#666', fontSize: '0.8rem' }}>
                          #{firstRank}{group.entries.length > 1 ? `-${lastRank}` : ''}
                        </span>
                        <span style={{ flex: 1 }}>
                          <span style={{ color: '#6ee7b7', fontWeight: 'bold' }}>{group.wins}W</span>
                          <span style={{ color: '#4a4a4a' }}> - </span>
                          <span style={{ color: '#f87171', fontWeight: 'bold' }}>{group.losses}L</span>
                        </span>
                        <span style={{ color: '#9CA3AF', marginRight: '10px', fontSize: '0.8rem' }}>{group.entries.length} {group.entries.length === 1 ? 'entry' : 'entries'}</span>
                        {group.hasMyEntry && (
                          <span style={{ background: '#E41C38', color: '#000', padding: '2px 8px', borderRadius: '4px', fontSize: '0.7rem', fontWeight: 'bold', marginRight: '10px' }}>
                            {group.myEntryCount} YOURS
                          </span>
                        )}
                        <span style={{ color: '#666', fontSize: '1rem' }}>{isExpanded ? '▼' : '▶'}</span>
                      </div>
                      {isExpanded && (
                        <div style={{ marginLeft: '20px', marginTop: '4px', marginBottom: '8px' }}>
                          {group.entries.map(entry => {
                            const isMine = MY_ENTRIES.includes(entry.name);
                            return (
                              <div key={entry.name} style={{
                                display: 'flex', alignItems: 'center', padding: '8px 12px', borderRadius: '6px', marginBottom: '2px',
                                background: isMine ? 'rgba(228,28,56,0.15)' : 'rgba(255,255,255,0.02)',
                                borderLeft: isMine ? '3px solid #E41C38' : '3px solid transparent'
                              }}>
                                <span style={{ width: '45px', fontWeight: 'bold', color: entry.rank <= 9 ? '#ffd93d' : '#666', fontSize: '0.75rem' }}>#{entry.rank}</span>
                                <span style={{ flex: 1, fontSize: '0.8rem', fontWeight: isMine ? 'bold' : 'normal', color: isMine ? '#F5F5DC' : '#9CA3AF' }}>{entry.name}</span>
                                <span style={{ fontSize: '0.7rem', color: '#666' }}>TB: {entry.tiebreaker}</span>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Payouts View */}
          {view === 'payouts' && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(120px, 1fr))', gap: '10px' }}>
              {[{ place: '1st', pct: 15 }, { place: '2nd', pct: 10 }, { place: '3rd', pct: 6 }, { place: '4th', pct: 5 },
                { place: '5th', pct: 3 }, { place: '6th', pct: 3 }, { place: '7-9th', pct: 2 }, { place: '10-60th', pct: 1 }, { place: 'Last', pct: 1 }
              ].map(p => (
                <div key={p.place} style={{ background: p.place === '1st' ? 'rgba(255,215,0,0.15)' : 'rgba(255,255,255,0.05)', padding: '15px', borderRadius: '10px', textAlign: 'center' }}>
                  <div style={{ color: p.place === '1st' ? '#ffd93d' : '#888', marginBottom: '5px', fontWeight: 'bold' }}>{p.place}</div>
                  <div style={{ fontSize: '1.2rem', fontWeight: 'bold', color: '#E41C38' }}>${Math.round(pot * p.pct / 100).toLocaleString()}</div>
                  <div style={{ fontSize: '0.7rem', color: '#666' }}>{p.pct}%</div>
                </div>
              ))}
            </div>
          )}

          <div style={{ marginTop: '30px', textAlign: 'center', color: '#555', fontSize: '0.75rem' }}>
            $10/loss to pot • Tiebreaker: Navy vs Cincinnati total
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BowlBashTracker />);
  </script>
</body>
</html>
